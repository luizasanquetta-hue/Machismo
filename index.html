<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Vozes da Igualdade — Consciência e Respeito</title>
    
    <style>
        /* ==========================================================================
           Design System: Glassmorphic Cyber-Noir com Paleta Roxa, Rosa e Laranja
           ========================================================================== */
        @import url('https://googleapis.com');

        :root {
            /* Tons base mantendo o Roxo como fundo principal e inserindo Rosa e Laranja */
            --bg-main: #140a24;          /* Roxo escuro profundo acolhedor */
            --bg-card: rgba(255, 255, 255, 0.08); /* Glassmorphism escuro */
            --text-main: #f3efff;        
            --text-muted: #bdaec6;       
            --primary: #f72585;          /* Rosa vibrante */
            --primary-light: #24113a;    
            --accent: #ffb703;           /* Laranja caloroso */
            --accent-glow: rgba(247, 37, 133, 0.2);
            --border: rgba(255, 255, 255, 0.1); 
            --radius: 24px;              
            --font-base: 16px;
            --blur: blur(24px);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] {
            /* Variação ainda mais profunda para o modo escuro */
            --bg-main: #0a0414;          
            --bg-card: rgba(10, 5, 20, 0.7);
            --text-main: #e2dbf0;
            --text-muted: #9587a3;
            --primary: #ff007f;
            --accent: #fb8500;
            --border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: var(--font-base);
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.65;
            letter-spacing: -0.015em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Fundo Dinâmico com Orbes de Luz Ambientais (Roxo, Rosa e Laranja) */
        body::before, body::after, .bg-orb {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        body::before { 
            top: -10%; 
            left: -10%; 
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #7b2cbf 0%, transparent 70%); /* Roxo */
            animation: floatGlow 14s infinite alternate ease-in-out;
        }
        body::after { 
            bottom: -10%; 
            right: -10%; 
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%); /* Rosa */
            animation: floatGlow 12s infinite alternate ease-in-out;
            animation-delay: 4s;
        }
        .bg-orb {
            top: 40%;
            left: 50%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%); /* Laranja */
            animation: floatGlow 16s infinite alternate ease-in-out;
            animation-delay: 2s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.15); }
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        /* Barra de Acessibilidade Flutuante */
        .accessibility-bar {
            background: rgba(20, 10, 36, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 10px 5%;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        .accessibility-bar button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .accessibility-bar button:hover { 
            transform: translateY(-2px); 
            border-color: var(--primary); 
            box-shadow: 0 8px 20px var(--accent-glow); 
        }

        /* Header */
        header {
            background-color: rgba(20, 10, 36, 0.6);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        header .logo { font-size: 1.5rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        header .logo span { color: var(--accent); }

        nav ul { display: flex; list-style: none; gap: 8px; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 40px; border: 1px solid var(--border); }
        
        nav ul li button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 40px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        nav ul li button:hover { color: var(--text-main); }
        nav ul li button.active { color: #140a24; background-color: var(--accent); box-shadow: 0 8px 20px rgba(255, 183, 3, 0.3); }

        /* Container Principal */
        .container {
            max-width: 1040px;
            margin: 40px auto;
            padding: 0 24px;
            min-height: 60vh;
        }

        /* Abas e Animações */
        .tab-content { display: none; }
        .tab-content.active-tab { display: block; }
        
        .fade-in { animation: smoothScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes smoothScale {
            from { opacity: 0; transform: scale(0.98) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Cartões */
        .card {
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(247, 37, 133, 0.3);
        }

        /* Hero Section */
        .hero-section { text-align: center; margin-bottom: 40px; }
        .hero-section h1 {
            font-size: 3.2rem;
            background: linear-gradient(135deg, var(--text-main) 20%, var(--primary) 60%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            line-height: 1.1;
        }
        .welcome-msg { font-size: 1.25rem; color: var(--text-muted); max-width: 780px; margin: 0 auto; font-weight: 500; }

        /* Banner de Apoio Emocional */
        .support-banner {
            background: linear-gradient(135deg, rgba(247, 37, 133, 0.15), rgba(255, 183, 3, 0.15));
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        .support-banner h2 { color: var(--primary); margin-bottom: 10px; }
        .support-banner p { font-size: 1.1rem; font-weight: 600; color: #fff; }

        /* Formário do Portal de Escuta */
        .form-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #140a24;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            align-self: flex-start;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(247, 37, 133, 0.4);
}/* Caixa de Mensagem Automatizada de Acolhimento */.welcome-box {display: none;margin-top: 25px;background: rgba(255, 183, 3, 0.1);border-left: 4px solid var(--accent);border-radius: 12px;padding: 20px;animation: smoothScale 0.4s ease forwards;}.welcome-box h4 { color: var(--accent); margin-bottom: 5px; }/* Grade Informativa - Tipos de Violência */.info-grid {display: grid;grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));gap: 20px;margin-top: 20px;}.info-item {background: rgba(255, 255, 255, 0.03);border: 1px solid var(--border);border-radius: 16px;padding: 20px;}.info-item h4 { color: var(--primary); margin-bottom: 8px; }/* Central de Ajuda */.emergency-card {border: 1px dashed var(--accent);background: rgba(255, 183, 3, 0.05);margin-top: 30px;}.emergency-number {display: inline-block;background: var(--accent);color: #140a24;padding: 4px 12px;border-radius: 8px;font-weight: 700;margin-top: 10px;}.icon { width: 18px; height: 18px; fill: currentColor; display: inline-block; vertical-align: middle; } A+ A- Contraste// Gerenciamento de Abasfunction switchTab(tabId) {document.querySelectorAll('.tab-content').forEach(tab => {tab.classList.remove('active-tab', 'fade-in');});document.querySelectorAll('.nav-link').forEach(link => {link.classList.remove('active');});const targetTab = document.getElementById(tabId);if(targetTab) {targetTab.classList.add('active-tab', 'fade-in');}const eventTarget = Array.from(document.querySelectorAll('.nav-link')).find(btn => btn.getAttribute('onclick').includes(tabId));if(eventTarget) eventTarget.classList.add('active');}// Envio Simulado do Desabafo e Exibição de Acolhimentofunction enviarDesabafo() {const txtArea = document.getElementById('desabafo');const acolhimentoBox = document.getElementById('acolhimento');if(txtArea.value.trim() !== "") {acolhimentoBox.style.display = "block";txtArea.value = ""; // Limpa o campo de texto por segurançaacolhimentoBox.scrollIntoView({ behavior: 'smooth' });} else {alert("Por favor, sinta-se à vontade para escrever algo antes de enviar.");}}// Sistema de Troca de Tema/Contrastefunction toggleTema() {const html = document.documentElement;const currentTheme = html.getAttribute('data-theme');const newTheme = currentTheme === 'dark' ? 'light' : 'dark';html.setAttribute('data-theme', newTheme);}// Controle de Acessibilidade: Tamanho da Fontelet currentFontSize = 16;function alterarFonte(action) {currentFontSize += action * 1;if(currentFontSize < 12) currentFontSize = 12;if(currentFontSize > 24) currentFontSize = 24;document.documentElement.style.setProperty('--font-base', currentFontSize + 'px');}
