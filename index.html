<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Vozes da Igualdade — Consciência e Respeito</title>
    <!-- Biblioteca de ícones FontAwesome para os botões e navegação -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Importação das fontes premium e contemporâneas */
        @import url('https://googleapis.com');

        /* ==========================================================================
           Design System: Glow-Minimalism & Bento Cards
           ========================================================================== */
        :root {
            --bg-main: #f5f5f7;          /* Cinza estúdio premium (Apple Style) */
            --bg-card: rgba(255, 255, 255, 0.85); /* Vidro fosco / Glassmorphism */
            --text-main: #1d1d1f;        
            --text-muted: #6e6e73;       
            --primary: #5a189a;          /* Roxo digital */
            --primary-light: #f3e8ff;    
            --accent: #6200ee;           
            --border: rgba(0, 0, 0, 0.05); 
            --radius: 18px;              
            --font-scale: 16px;
            --blur: blur(20px);
            --shadow: 0 8px 32px 0 rgba(90, 24, 154, 0.04);
        }

        [data-theme="dark"] {
            --bg-main: #000000;          /* Preto OLED absoluto */
            --bg-card: rgba(22, 22, 23, 0.8);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --primary: #9d4edd;
            --primary-light: #241435;
            --accent: #bb86fc;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: var(--font-scale);
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.65;
            letter-spacing: -0.015em;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text-main);
        }

        input, textarea, button, nav, footer {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: 1040px;
            margin: 40px auto;
            padding: 0 24px;
            min-height: 75vh;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 35px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            transition: box-shadow 0.3s ease, background-color 0.5s ease;
        }
        .card:hover { box-shadow: 0 12px 40px 0 rgba(90, 24, 154, 0.08); }

        /* Barra de Acessibilidade Flutuante */
        .accessibility-bar {
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: var(--blur);
            padding: 12px 5%;
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            border-bottom: 1px solid var(--border);
        }
        .accessibility-bar button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .accessibility-bar button:hover { transform: translateY(-1px); border-color: var(--primary); }

        /* Header Estilo Dynamic Island */
        header {
            background-color: var(--bg-card);
            backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        header .logo { font-size: 1.25rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        nav ul { display: flex; list-style: none; gap: 8px; }
        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        nav ul li a:hover { color: var(--text-main); background-color: rgba(0,0,0,0.03); }
        nav ul li a.active { color: var(--primary); background-color: var(--primary-light); }

        /* Abas e Animações */
        .tab-content { display: none; }
        .active-tab { display: block; }
        .fade-in { animation: smoothScale 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes smoothScale {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hero-section { text-align: center; margin-bottom: 48px; }
        .hero-section h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .welcome-msg { font-size: 1.2rem; color: var(--text-muted); max-width: 760px; margin: 0 auto; }

        /* Carrossel Cinema */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .carousel-track { width: 100%; height: 100%; position: relative; }
        .carousel-slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; z-index: 1; }
        .carousel-slide.active { opacity: 1; z-index: 2; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-caption {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            max-width: fit-content;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            color: #000000;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-btn.prev { left: 16px; }
        .carousel-btn.next { right: 16px; }

        /* Bento Grid Layout */
        .intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .intro-card { background: var(--bg-card); border: 1px solid var(--border); padding: 32px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .intro-card h3 { font-size: 1.3rem; margin-bottom: 12px; color: var(--primary); }
        .intro-card p { font-size: 1rem; color: var(--text-muted); }

        /* Formulários e Escuta */
        .section-header { margin-bottom: 40px; }
        .section-header h2 { font-size: 2.2rem; margin-bottom: 8px; color: var(--primary); }
        .section-header p { color: var(--text-muted); font-size: 1.1rem; }

        .escuta-wrapper { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(90, 24, 154, 0.1);
        }

        /* Botões de Ação */
        .btn { border: none; padding: 14px 28px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border-radius: 30px; text-align: center; transition: all 0.2s ease; }
        .btn-primary { background: var(--primary); color: #ffffff; box-shadow: 0 4px 12px rgba(90, 24, 154, 0.15); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(90, 24, 154, 0.25); }
        .btn-accent { background: var(--text-main); color: var(--bg-main); }
        .btn-accent:hover { opacity: 0.9; }
        .btn-wide { width: 100%; }
