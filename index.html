<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Vozes da Igualdade — Consciência e Respeito</title>
    
    <style>
        /* ==========================================================================
           Design System: Glassmorphic Cyber-Noir Ultra-Premium (2026)
           ========================================================================== */
        @import url('https://googleapis.com');

        :root {
            --bg-main: #0b0518;          /* Roxo escuro ultra profundo */
            --bg-card: rgba(255, 255, 255, 0.04); /* Efeito Vidro Translúcido */
            --text-main: #fcfbfe;        
            --text-muted: #a69bb1;       
            --primary: #ff1f87;          /* Neon Rosa */
            --accent: #ff9100;           /* Laranja Vibrante */
            --danger: #e63946;           /* Vermelho Emergência */
            --border: rgba(255, 255, 255, 0.08); 
            --radius: 20px;              
            --font-base: 16px;
            --blur: blur(30px);
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        /* Contraste Acessível Ativado por JS */
        .high-contrast {
            --bg-main: #000000;
            --bg-card: #111111;
            --text-main: #ffffff;
            --text-muted: #dddddd;
            --primary: #ffff00;
            --accent: #00ffff;
            --border: #ffffff;
            --shadow: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--font-base);
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Iluminação de Fundo Dinâmica (Roxo, Rosa, Laranja) */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.35;
            mix-blend-mode: screen;
            filter: blur(120px);
        }
        .glow-1 { top: -20%; left: -10%; background: radial-gradient(circle, #7209b7 0%, transparent 70%); animation: orbit 20s infinite alternate linear; }
        .glow-2 { bottom: -20%; right: -10%; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); animation: orbit 25s infinite alternate-reverse linear; }
        .glow-3 { top: 30%; left: 40%; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); animation: orbit 18s infinite alternate linear; }

        @keyframes orbit {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.2); }
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        /* Atalhos Rápidos e Saída de Emergência */
        .top-utility-bar {
            background: rgba(11, 5, 24, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .accessibility-controls { display: flex; gap: 8px; }
        .top-utility-bar button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .top-utility-bar button:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--accent); }
        
        /* Botão do Pânico Estilizado */
        .btn-panic {
            background: var(--danger) !important;
            color: #fff !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
            animation: pulseDanger 2s infinite;
        }
        @keyframes pulseDanger {
            0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(230, 57, 70, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
        }

        /* Layout do Header Principal */
        header {
            background: rgba(11, 5, 24, 0.4);
            backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        .logo { font-size: 1.4rem; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }

        nav ul { display: flex; list-style: none; gap: 6px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 40px; border: 1px solid var(--border); }
        nav ul li button {
            background: transparent; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 0.9rem; font-weight: 600; padding: 8px 18px; border-radius: 40px; transition: all 0.2s ease;
        }
        nav ul li button:hover { color: var(--text-main); }
        nav ul li button.active { color: #0b0518; background-color: var(--accent); font-weight: 700; }

        /* Estrutura de Conteúdo e Cartões */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; min-height: 65vh; }
        .tab-content { display: none; }
        .tab-content.active-tab { display: block; }
        
        .fade-in { animation: smoothReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes smoothReveal {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card {
            background: var(--bg-card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border); border-radius: var(--radius); padding: 35px;
            box-shadow: var(--shadow); margin-bottom: 25px; transition: border-color 0.3s ease;
        }
        .card:hover { border-color: rgba(255, 31, 135, 0.25); }

        /* Seção Inicial e Frases Deslumbrantes */
        .hero-section { text-align: center; margin-bottom: 35px; }
        .hero-section h1 {
            font-size: 3rem; background: linear-gradient(135deg, #fff 10%, var(--primary) 60%, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px;
        }
        .welcome-msg { font-size: 1.15rem; color: var(--text-muted); max-width: 720px; margin: 0 auto; font-weight: 400; }

        .support-banner {
            background: linear-gradient(135deg, rgba(255, 31, 135, 0.12), rgba(255, 145, 0, 0.12));
            border: 1px solid var(--primary); border-radius: var(--radius); padding: 30px; text-align: center; margin-bottom: 25px;
        }
        .support-banner h2 { color: var(--primary); font-size: 1.6rem; margin-bottom: 8px; }
        .support-banner p { font-size: 1.05rem; color: #fff; font-weight: 500; }

        /* Portal de Escuta Inteligente */
        .form-group { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
        textarea {
            width: 100%; height: 160px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border);
            border-radius: 14px; padding: 15px; color: #fff; font-family: inherit; font-size: 1rem;
            resize: none; transition: border-color 0.2s;
        }
        textarea:focus { outline: none; border-color: var(--primary); }
        
        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--accent)); color: #0b0518;
            border: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 0.95rem;
            cursor: pointer; align-self: flex-start; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 31, 135, 0.35); }

        /* Caixa de Acolhimento Automatizada */
        .welcome-box {
            display: none; margin-top: 25px; background: rgba(255, 145, 0, 0.08);
            border-left: 4px solid var(--accent); border-radius: 12px; padding: 22px;
            animation: smoothReveal 0.4s ease forwards;
        }
        .welcome-box h4 { color: var(--accent); font-size: 1.1rem; margin-bottom: 6px; }
        .protocol-badge {
            display: inline-block; background: rgba(255,255,255,0.06); padding: 4px 10px;
            border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: var(--text-muted); margin-top: 10px;
        }

        /* Grade da Seção de Conscientização */
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
        .info-item { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
        .info-item h4 { color: var(--primary); margin-bottom: 6px; font-size: 1.05rem; }
.info-item p { font-size: 0.88rem; color: var(--text-muted); }
